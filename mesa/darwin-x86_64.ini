# Meson cross file: Mesa's ANV for macOS x86_64 (built on Apple Silicon, run under Rosetta).
[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
